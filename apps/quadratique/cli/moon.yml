id: "quadratique-cli"
language: "rust"
layer: "application"
tags: ["quadratique"]

dependsOn: ["quadratique-server"]
fileGroups:
  sources:
    - "src/**/*"
    - "Cargo.toml"
    - "/apps/quadratique/skill/quadratique/*.md"
  server:
    - "/apps/quadratique/server/src/**/*"
    - "/apps/quadratique/server/Cargo.toml"
    - "/apps/quadratique/server/build.rs"
    - "/apps/quadratique/catalog/quadratique.acidcat.json"
  workspace:
    - "/apps/quadratique/Cargo.toml"
    - "/apps/quadratique/Cargo.lock"
    - "/apps/quadratique/rust-toolchain.toml"

tasks:
  build:
    command: "cargo build -p quadratique"
    inputs: ["@group(sources)", "@group(server)", "@group(workspace)"]
    # The binary is `quadratique`, or `quadratique.exe` on Windows; cargo writes its dependency list and debug symbols
    # next to it.
    outputs:
      - "/apps/quadratique/target/debug/quadratique*"
      - "!/apps/quadratique/target/debug/quadratique.d"
      - "!/apps/quadratique/target/debug/quadratique.pdb"
  test:
    description: "The command line's tests, built in their own target folder: cargo test links another quadratique binary than cargo build, and replacing target/debug/quadratique while a test runs it breaks the test."
    command: "cargo test -p quadratique --target-dir ../target/cli-test"
    inputs: ["@group(sources)", "@group(server)", "@group(workspace)", "tests/**/*", "/apps/quadratique/server/tests/fixtures/findings/review.json"]
    tags: ["candidate"]
  lint:
    command: "cargo clippy -p quadratique --all-targets -- -D warnings"
    inputs: ["@group(sources)", "@group(server)", "@group(workspace)", "tests/**/*", "/apps/quadratique/server/tests/fixtures/findings/review.json"]
  fmt-check:
    command: "cargo fmt -p quadratique --check"
    inputs: ["@group(sources)", "tests/**/*"]
