[package]
name = "quadratique"
description = "The quadratique command line: a client of the Quadratique server, which it starts when needed."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
include = ["/src/**/*", "/LICENSE"]

[lints]
workspace = true

[features]
embedded-web = ["quadratique-server/embedded-web"]

[dependencies]
acid-cat-core.workspace = true
futures.workspace = true
quadratique-server.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["event"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }
sysctl.workspace = true

# Lets `cargo binstall` download the archive of a GitHub release instead of building.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/quadratique-{ version }-{ target }{ archive-suffix }"
bin-dir = "quadratique-{ version }-{ target }/bin/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
