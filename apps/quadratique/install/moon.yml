id: "quadratique-install"
language: "bash"
layer: "automation"
tags: ["quadratique"]

project:
  title: "Quadratique install"
  description: "Builds the quadratique binary, with the web app inside it, and puts it on the PATH of the current user."

# The task scripts are POSIX shell: on Windows they run in Git's bash, not PowerShell.
taskOptions:
  windowsShell: "bash"

fileGroups:
  scripts: ["*.sh"]
  rust:
    - "/apps/quadratique/cli/src/**/*"
    - "/apps/quadratique/cli/Cargo.toml"
    - "/apps/quadratique/skill/quadratique/*.md"
    - "/apps/quadratique/server/src/**/*"
    - "/apps/quadratique/server/Cargo.toml"
    - "/apps/quadratique/server/build.rs"
    - "/apps/quadratique/catalog/quadratique.acidcat.json"
    - "/apps/quadratique/Cargo.toml"
    - "/apps/quadratique/Cargo.lock"
    - "/apps/quadratique/rust-toolchain.toml"
    - "/.cargo/config.toml"

tasks:
  install:
    description: "Build the release binary with the web app inside it, and copy it to $XDG_BIN_HOME/quadratique (else ~/.local/bin/quadratique). It starts nothing."
    script: |
      set -eu
      sh install.sh "$(sh build.sh ../web/dist ../target)"
    deps: ["quadratique-web:build"]
    options:
      cache: false
      runInCI: false
  test:
    description: "Install on a temporary home: the binary serves the web app with no source tree, a release archive installs with no Rust toolchain over a running older build, and the readiness check of an earlier upgrader passes against the new binary."
    command: "sh test.sh"
    deps: ["quadratique-web:build"]
    inputs: ["$CFLAGS", "@group(scripts)", "@group(rust)", "/apps/quadratique/web/dist/**/*", "/apps/quadratique/README.md", "/LICENSE"]
    tags: ["candidate"]
