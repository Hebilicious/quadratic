[project]
name = "quadratique-eval"
version = "0.1.0"
description = "Runs the same scenarios on Quadratique, lific and Beads and measures tasks completed, double claims, lost updates, tracker tokens, setup cost, and the answers to the human's and history questions."
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = ["tiktoken==0.12.0"]

[project.scripts]
qeval = "qeval.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qeval"]

[tool.uv]
python-preference = "only-system"
