[workspace]
resolver = "3"
members = ["server", "cli"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.2.0"
license = "MIT"
repository = "https://github.com/Hebilicious/quadratique"
homepage = "https://github.com/Hebilicious/quadratique"
readme = "README.md"
keywords = ["issue-tracker", "ai-agents", "mcp", "git", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[workspace.dependencies]
quadratique-server = { path = "server", version = "0.2.0" }
acid-cat-core = "=0.6.0"
base64 = "0.22"
bytes = "1"
doltlite = "=0.51.13"
dunce = "1"
exacl = "0.13"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
getrandom = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libz-sys = { version = "1", default-features = false, features = ["static"] }
jsonschema = { version = "0.58", default-features = false }
jiff = "0.2"
proptest = "1.7"
rustix = { version = "1", features = ["process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = "0.7"
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package.doltlite]
opt-level = 3
