[package]
name = "quadratique-server"
description = "The Quadratique server: the issue lifecycle, the doltlite store and the AcidCat application."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
include = ["/src/**/*", "/build.rs", "/web-dist/**/*", "/LICENSE"]

[lints]
workspace = true

[features]
embedded-web = []

[dependencies]
acid-cat-core.workspace = true
base64.workspace = true
bytes.workspace = true
doltlite.workspace = true
dunce.workspace = true
futures.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
getrandom.workspace = true
jiff.workspace = true
jsonschema.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-util.workspace = true

# The home policy (src/home.rs) reads modes, owners and Linux's ACLs, and the account it runs as.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

# A listener stops listening for every copy of its descriptor (src/serve.rs, stop_listening).
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["net"] }

# macOS keeps ACLs out of reach of getxattr: the home policy reads them through exacl.
[target.'cfg(target_os = "macos")'.dependencies]
exacl.workspace = true

# doltlite links zlib by name and Windows has none: this builds one from source for it to link.
[target.'cfg(windows)'.dependencies]
libz-sys.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-util.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["event", "fs", "net", "process"] }
