id: "quadratique-server"
language: "rust"
layer: "library"
tags: ["quadratique"]

# The task scripts are POSIX shell: on Windows they run in Git's bash, not PowerShell.
taskOptions:
  windowsShell: "bash"

fileGroups:
  sources:
    - "src/**/*"
    - "Cargo.toml"
    - "build.rs"
    - "/apps/quadratique/catalog/quadratique.acidcat.json"
  workspace:
    - "/apps/quadratique/Cargo.toml"
    - "/apps/quadratique/Cargo.lock"
    - "/apps/quadratique/rust-toolchain.toml"
    - "/.cargo/config.toml"

tasks:
  build:
    command: "cargo build -p quadratique-server"
    inputs: ["$CFLAGS", "@group(sources)", "@group(workspace)"]
  test:
    command: "cargo test -p quadratique-server"
    inputs: ["$CFLAGS", "@group(sources)", "@group(workspace)", "tests/**/*"]
    tags: ["candidate"]
  test-as-nobody:
    description: "Needs `sudo -n` as root and as the account nobody, and /tmp, which nobody can traverse: runs the ignored tests in which the account nobody connects to the Unix socket of a server of this account (EACCES, and a connection once the test loosens the home), holds more TCP connections than the web app serves at once (Linux), and in which the server refuses a socket or a link that root gives to nobody; first `quadratique-cli:test-as-nobody`, in which nobody runs a command. Not part of `test`."
    command: "cargo test -p quadratique-server --test server -- --ignored --nocapture another_account"
    deps: ["quadratique-cli:test-as-nobody"]
    inputs: ["$CFLAGS", "@group(sources)", "@group(workspace)", "tests/**/*"]
    options:
      cache: false
  stage-web:
    description: "Copy the built web app into web-dist, which cargo package takes into the crate, so that a build of the published crate embeds it."
    script: |
      set -eu
      rm -rf web-dist
      cp -R ../web/dist web-dist
    deps: ["quadratique-web:build"]
    options:
      cache: false
      runInCI: false
  preflight:
    description: "Before cargo publish: stage the web app (stage-web runs first), then fail when a crate lacks the staged web app (or it is not the current build), the catalog JSON, the skill files or the licence, including a link that a checkout without symbolic links wrote as a plain file."
    command: "sh preflight.sh"
    deps: ["~:stage-web"]
    options:
      cache: false
      runInCI: false
  package-test:
    description: "The preflight's cases, and how build.rs embeds the web app: in the repository with and without the feature, and in a packaged crate with and without the feature, next to an unrelated web folder, and without its staged web app."
    command: "sh package-test.sh"
    deps: ["quadratique-web:build"]
    inputs: ["$CFLAGS", "@group(sources)", "@group(workspace)", "preflight.sh", "package-test.sh", "/apps/quadratique/web/dist/**/*", "/apps/quadratique/cli/src/skill/*", "/apps/quadratique/cli/LICENSE", "/apps/quadratique/skill/quadratique/*.md", "/LICENSE"]
    tags: ["candidate"]
  lint:
    command: "cargo clippy -p quadratique-server --all-targets -- -D warnings"
    inputs: ["$CFLAGS", "@group(sources)", "@group(workspace)", "tests/**/*"]
  fmt-check:
    command: "cargo fmt -p quadratique-server --check"
    inputs: ["@group(sources)", "tests/**/*"]
