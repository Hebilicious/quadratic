[package]
name = "quadratic"
description = "The quadratic command line: a client of the Quadratic server, which it starts when needed."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
include = ["/src/**/*", "/LICENSE"]

[lints]
workspace = true

[features]
embedded-web = ["quadratic-server/embedded-web"]

[dependencies]
acid-cat-core.workspace = true
futures.workspace = true
quadratic-server.workspace = true
rustix.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
rustix = { workspace = true, features = ["event"] }
tempfile.workspace = true

# Lets `cargo binstall` download the archive of a GitHub release instead of building.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/quadratic-{ version }-{ target }{ archive-suffix }"
bin-dir = "quadratic-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
