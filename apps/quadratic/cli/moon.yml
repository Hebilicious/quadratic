id: "quadratic-cli"
language: "rust"
layer: "application"
tags: ["quadratic"]

dependsOn: ["quadratic-server"]
fileGroups:
  sources:
    - "src/**/*"
    - "Cargo.toml"
    - "/apps/quadratic/skill/quadratic/*.md"
  server:
    - "/apps/quadratic/server/src/**/*"
    - "/apps/quadratic/server/Cargo.toml"
    - "/apps/quadratic/server/build.rs"
    - "/apps/quadratic/catalog/quadratic.acidcat.json"
  workspace:
    - "/apps/quadratic/Cargo.toml"
    - "/apps/quadratic/Cargo.lock"
    - "/apps/quadratic/rust-toolchain.toml"

tasks:
  build:
    command: "cargo build -p quadratic"
    inputs: ["@group(sources)", "@group(server)", "@group(workspace)"]
    outputs: ["/apps/quadratic/target/debug/quadratic"]
  test:
    description: "The command line's tests, built in their own target folder: cargo test links another quadratic binary than cargo build, and replacing target/debug/quadratic while a test runs it breaks the test."
    command: "cargo test -p quadratic --target-dir ../target/cli-test"
    inputs: ["@group(sources)", "@group(server)", "@group(workspace)", "tests/**/*", "/apps/quadratic/server/tests/fixtures/findings/review.json"]
    tags: ["candidate"]
  lint:
    command: "cargo clippy -p quadratic --all-targets -- -D warnings"
    inputs: ["@group(sources)", "@group(server)", "@group(workspace)", "tests/**/*", "/apps/quadratic/server/tests/fixtures/findings/review.json"]
  fmt-check:
    command: "cargo fmt -p quadratic --check"
    inputs: ["@group(sources)", "tests/**/*"]
