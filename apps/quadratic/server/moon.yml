id: "quadratic-server"
language: "rust"
layer: "library"
tags: ["quadratic"]

fileGroups:
  sources:
    - "src/**/*"
    - "Cargo.toml"
    - "build.rs"
    - "/apps/quadratic/catalog/quadratic.acidcat.json"
  workspace:
    - "/apps/quadratic/Cargo.toml"
    - "/apps/quadratic/Cargo.lock"
    - "/apps/quadratic/rust-toolchain.toml"

tasks:
  build:
    command: "cargo build -p quadratic-server"
    inputs: ["@group(sources)", "@group(workspace)"]
  test:
    command: "cargo test -p quadratic-server"
    inputs: ["@group(sources)", "@group(workspace)", "tests/**/*"]
    tags: ["candidate"]
  test-as-nobody:
    description: "Needs `sudo -n -u nobody` to work without a password: runs the ignored test in which the account nobody calls a server of this account with curl and must get the owner-only 403. Not part of `test`."
    command: "cargo test -p quadratic-server --test server -- --ignored --exact process::a_process_of_another_account_is_refused --nocapture"
    inputs: ["@group(sources)", "@group(workspace)", "tests/**/*"]
    options:
      cache: false
  stage-web:
    description: "Copy the built web app into web-dist, which cargo package takes into the crate, so that a build of the published crate with the embedded-web feature embeds it."
    script: |
      set -eu
      rm -rf web-dist
      cp -R ../web/dist web-dist
    deps: ["quadratic-web:build"]
    options:
      cache: false
      runInCI: false
  lint:
    command: "cargo clippy -p quadratic-server --all-targets -- -D warnings"
    inputs: ["@group(sources)", "@group(workspace)", "tests/**/*"]
  fmt-check:
    command: "cargo fmt -p quadratic-server --check"
    inputs: ["@group(sources)", "tests/**/*"]
