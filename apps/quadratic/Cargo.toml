[workspace]
resolver = "3"
members = ["server", "cli"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
quadratic-server = { path = "server" }
acid-cat-core = "=0.6.0"
base64 = "0.22"
bytes = "1"
doltlite = "=0.51.13"
futures = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jsonschema = { version = "0.58", default-features = false }
jiff = "0.2"
proptest = "1.7"
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-util = "0.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package.doltlite]
opt-level = 3
