id: "quadratic-catalog"
language: "javascript"
layer: "library"
tags: ["quadratic"]

project:
  title: "Quadratic catalog"
  description: "The AcidCat catalog of Quadratic, shared by the Rust server and the TypeScript core of the web app."

fileGroups:
  source: ["**/*.pkl", "PklProject", "PklProject.deps.json"]

tasks:
  write:
    description: "Render quadratic.pkl to quadratic.acidcat.json, in canonical form."
    script: |
      set -eu
      mkdir -p "$workspaceRoot/.tmp"
      run=$(mktemp -d "$workspaceRoot/.tmp/quadratic-catalog.XXXXXX")
      trap 'rm -rf "$run"' EXIT
      pkl eval quadratic.pkl --output-path "$run/quadratic.acidcat.json"
      acid-cat format --write "$run/quadratic.acidcat.json"
      mv "$run/quadratic.acidcat.json" quadratic.acidcat.json
    inputs: ["@group(source)", "package.json", "/.prototools"]
    outputs: ["quadratic.acidcat.json"]
    toolchains: ["system", "node"]

  check:
    description: "Fail when quadratic.acidcat.json is not what quadratic.pkl renders, or when acid-cat check --strict refuses it."
    script: |
      set -eu
      mkdir -p "$workspaceRoot/.tmp"
      run=$(mktemp -d "$workspaceRoot/.tmp/quadratic-catalog.XXXXXX")
      trap 'rm -rf "$run"' EXIT
      pkl eval quadratic.pkl --output-path "$run/rendered.acidcat.json"
      acid-cat format --write "$run/rendered.acidcat.json"
      if ! diff -u quadratic.acidcat.json "$run/rendered.acidcat.json"; then
        echo "quadratic.acidcat.json is stale: run moon run quadratic-catalog:write" >&2
        exit 1
      fi
      acid-cat check --strict quadratic.acidcat.json
    inputs: ["@group(source)", "quadratic.acidcat.json", "package.json", "/.prototools"]
    toolchains: ["system", "node"]
    tags: ["candidate"]
