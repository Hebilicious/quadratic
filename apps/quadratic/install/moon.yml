id: "quadratic-install"
language: "bash"
layer: "automation"
tags: ["quadratic"]

project:
  title: "Quadratic install"
  description: "Installs the quadratic binary, with the web app inside it, and its systemd user service for the current user."

fileGroups:
  scripts: ["*.sh"]
  rust:
    - "/apps/quadratic/cli/src/**/*"
    - "/apps/quadratic/cli/Cargo.toml"
    - "/apps/quadratic/skill/quadratic/*.md"
    - "/apps/quadratic/server/src/**/*"
    - "/apps/quadratic/server/Cargo.toml"
    - "/apps/quadratic/server/build.rs"
    - "/apps/quadratic/catalog/quadratic.acidcat.json"
    - "/apps/quadratic/Cargo.toml"
    - "/apps/quadratic/Cargo.lock"
    - "/apps/quadratic/rust-toolchain.toml"

tasks:
  install:
    description: "Build the release binary with the web app inside it, install it as $XDG_BIN_HOME/quadratic (else ~/.local/bin/quadratic), and install, enable and restart the systemd user service quadratic.service."
    script: |
      set -eu
      sh install.sh "$(sh build.sh ../web/dist ../target)"
    deps: ["quadratic-web:build"]
    options:
      cache: false
      runInCI: false
  uninstall:
    description: "Stop and remove the systemd user service quadratic.service, its unit and the installed binary. The store stays."
    command: "sh uninstall.sh"
    options:
      cache: false
      runInCI: false
  test:
    description: "Install on a temporary home with no systemd: the binary serves the web app with no source tree, a release archive installs with no Rust toolchain, the service's ownership cases, and an uninstall that keeps the store."
    command: "sh test.sh"
    deps: ["quadratic-web:build"]
    inputs: ["@group(scripts)", "@group(rust)", "/apps/quadratic/web/dist/**/*", "/apps/quadratic/README.md", "/LICENSE"]
    tags: ["candidate"]
