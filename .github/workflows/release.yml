name: Release

# GitHub starts no workflows for tags that GITHUB_TOKEN makes, and holds the checks of pull requests that GITHUB_TOKEN
# opens. So every step that writes to the repository uses a token of the release GitHub App, minted with only the
# permissions that step needs, in a job that runs no project code.
on:
  push:
    branches: [main]
  # A pull request that changes how a release is built builds the archives, without releasing them.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - ".github/release-tests/**"
      - "apps/quadratique/install/**"
      - ".cargo/config.toml"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Opens or updates the release pull request; once it is merged, creates the tag and a draft release.
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token }}

  # Names the release to finish, even when release-please failed after it made the draft: the release whose tag is
  # `v` and the version that `.release-please-manifest.json` says at the pushed commit. A draft is built when its tag
  # points at the commit that release-please released; a published release with its four files needs no build; a
  # published release without them fails here and is not changed. For a draft or a complete release, it also names
  # the commit that the crates are published from: the commit that both the tag and the release point at. Checks out
  # nothing and runs no project code; its token can see drafts, which needs write access to contents.
  pending:
    name: release to finish
    needs: release-please
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pending.outputs.tag }}
      sha: ${{ steps.pending.outputs.sha }}
      version: ${{ steps.pending.outputs.version }}
      release: ${{ steps.pending.outputs.release }}
      crates-sha: ${{ steps.pending.outputs.crates-sha }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Name the release to finish
        id: pending
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CREATED: ${{ needs.release-please.outputs.created }}
          CREATED_TAG: ${{ needs.release-please.outputs.tag }}
          CREATED_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          repo=repos/$GITHUB_REPOSITORY
          fail() { echo "::error::$*" >&2; exit 1; }
          manifest_version() {
            gh api "$repo/contents/.release-please-manifest.json?ref=$1" --jq .content | base64 -d | jq -r '.["."]'
          }
          version=$(manifest_version "$GITHUB_SHA")
          case $version in '' | *[!0-9A-Za-z.+-]*) fail "the manifest at $GITHUB_SHA has no version: $version" ;; esac
          tag=v$version
          if [ "$CREATED" = true ] && [ "$CREATED_TAG" != "$tag" ]; then
            fail "release-please created $CREATED_TAG, but the manifest at $GITHUB_SHA says $version"
          fi
          releases=$(gh api --paginate "$repo/releases?per_page=100" | jq -s --arg tag "$tag" '[.[][] | select(.tag_name == $tag)]')
          case $(jq length <<< "$releases") in
            0) echo "There is no release $tag: nothing to build."; exit 0 ;;
            1) ;;
            *) fail "several releases have the tag $tag: delete all but one, then run this workflow again" ;;
          esac
          id=$(jq -r '.[0].id' <<< "$releases")
          if [ "$(jq -r '.[0].draft' <<< "$releases")" = false ]; then
            missing=""
            for target in aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
              archive=quadratique-$version-$target.tar.gz
              digest=$(jq -r --arg name "$archive" '.[0].assets[] | select(.name == $name) | .digest' <<< "$releases")
              checksum=$(jq -r --arg name "$archive.sha256" '.[0].assets[] | select(.name == $name) | .id' <<< "$releases")
              if [ -z "$digest" ] || [ -z "$checksum" ] \
                || [ "sha256:$(gh api -H 'Accept: application/octet-stream' "$repo/releases/assets/$checksum" | cut -d ' ' -f 1)" != "$digest" ]; then
                missing="$missing $archive"
              fi
            done
            [ -z "$missing" ] || fail "the release $tag is public, but these archives are missing or do not match their SHA-256 file:$missing. Nothing was changed. Attach them by hand as the README's \"When a release stops half-way\" says."
            echo "The release $tag is published with its four files: no archive to build."
            sha=$(gh api "$repo/commits/refs/tags/$tag" --jq .sha) || fail "the release $tag has no tag $tag"
            target=$(jq -r '.[0].target_commitish' <<< "$releases")
            [ "$target" = "$sha" ] || fail "the tag $tag points at $sha, but the public release $tag was built from $target, so crates built from the tag would not match its binaries. Nothing was published. Point the tag back at $target (git push --force origin $target:refs/tags/$tag), then push to main again."
            [ "$(manifest_version "$sha")" = "$version" ] || fail "the tag $tag points at $sha, whose manifest does not say $version"
            case $(gh api "$repo/compare/$sha...$GITHUB_SHA" --jq .status) in
              ahead | identical) ;;
              *) fail "the tag $tag points at $sha, which is not in the history of $GITHUB_SHA" ;;
            esac
            {
              echo "version=$version"
              echo "crates-sha=$sha"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha=$(gh api "$repo/commits/refs/tags/$tag" --jq .sha) || fail "the draft release $tag has no tag $tag"
          if [ "$CREATED" = true ]; then
            [ "$sha" = "$CREATED_SHA" ] || fail "the tag $tag points at $sha, not at $CREATED_SHA, which release-please released"
          else
            [ "$(manifest_version "$sha")" = "$version" ] || fail "the tag $tag points at $sha, whose manifest does not say $version"
            case $(gh api "$repo/compare/$sha...$GITHUB_SHA" --jq .status) in
              ahead | identical) ;;
              *) fail "the tag $tag points at $sha, which is not in the history of $GITHUB_SHA" ;;
            esac
            echo "The draft release $tag is not finished: building it again."
          fi
          [ "$(jq -r '.[0].target_commitish' <<< "$releases")" = "$sha" ] || fail "the draft release $tag targets another commit than its tag, $sha"
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "version=$version"
            echo "release=$id"
            echo "crates-sha=$sha"
          } >> "$GITHUB_OUTPUT"


  # On a pull request: release-please, as the pinned action bundles it, opens the release pull request and turns the
  # merged one into the release; and the scripts of the jobs below behave as they should against a fake `gh`.
  release-tests:
    name: release-please and the release scripts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
      - run: node .github/release-tests/release-please.cjs
      - run: bash .github/release-tests/steps.sh

  # Builds and packages one binary per platform. Holds no token: a build dependency it runs cannot write anything.
  binaries:
    name: binary for ${{ matrix.target }}
    needs: pending
    if: >-
      !cancelled() && (
        github.event_name == 'pull_request' ||
        needs.pending.outputs.tag != ''
      )
    # The oldest hosted images (glibc 2.35), so that the binary runs on older distributions too.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    # Only stops a hang.
    timeout-minutes: 60
    steps:
      # The release's commit, by its SHA: a tag name could also be a branch's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pending.outputs.sha || github.sha }}
          # Moon compares the checkout with `main`, so it needs the history.
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag points at this commit
        if: needs.pending.outputs.tag != ''
        env:
          TAG: ${{ needs.pending.outputs.tag }}
        run: test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"

      # The store engine is compiled from C and links zlib.
      - name: Install the system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential zlib1g-dev

      # Installs proto, then the tools that .prototools pins, and caches them.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - run: pnpm install --frozen-lockfile

      - name: Check the host and the version
        id: build
        env:
          RELEASED: ${{ needs.pending.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          test "$host" = "$TARGET"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/quadratique/Cargo.toml)
          if [ -n "$RELEASED" ]; then test "$version" = "$RELEASED"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the web app and the release binary with it inside
        run: |
          moon run quadratique-web:build
          binary=$(sh apps/quadratique/install/build.sh apps/quadratique/web/dist apps/quadratique/target)
          echo "BINARY=$binary" >> "$GITHUB_ENV"

      - name: Show the libraries and the newest glibc the binary needs
        env:
          TARGET: ${{ matrix.target }}
        run: |
          glibc=$(objdump -T "$BINARY" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          libraries=$(objdump -p "$BINARY" | awk '/NEEDED/ { print $2 }' | tr '\n' ' ')
          echo "The binary for $TARGET needs glibc ${glibc#GLIBC_} or newer, and these libraries: $libraries" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check that the binary runs
        run: |
          export QUADRATIQUE_HOME="$RUNNER_TEMP/quadratique-home"
          "$BINARY" --version

      - name: Package the archive and its SHA-256 file
        env:
          VERSION: ${{ steps.build.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          archive=$(sh apps/quadratique/install/package.sh "$BINARY" "$VERSION" "$TARGET" "$RUNNER_TEMP/release")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quadratique-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          # A re-run of this job keeps the run, and so the artifact's name.
          overwrite: true

  # Attaches the archives to the draft release and publishes it. Checks out nothing and runs no project code: it only
  # reads the artifacts of this run, checks them, and holds the only token here that can change a release.
  publish:
    name: attach the archives and publish
    needs: [pending, binaries]
    if: github.event_name == 'push' && needs.pending.outputs.release != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quadratique-*
          path: assets
          merge-multiple: true

      - name: Check that the four files are there and that each archive matches its SHA-256 file
        working-directory: assets
        env:
          VERSION: ${{ needs.pending.outputs.version }}
        run: |
          set -euo pipefail
          wanted=$(for target in aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            printf '%s\n' "quadratique-$VERSION-$target.tar.gz" "quadratique-$VERSION-$target.tar.gz.sha256"
          done | LC_ALL=C sort | tr '\n' ' ')
          present=$(find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort | tr '\n' ' ')
          if [ "$present" != "$wanted" ]; then
            echo "the artifacts are: $present; the release needs: $wanted" >&2
            exit 1
          fi
          for checksum in *.sha256; do
            [ "$(awk '{ print $2 }' "$checksum")" = "${checksum%.sha256}" ] || { echo "$checksum names another file" >&2; exit 1; }
            sha256sum --check --strict "$checksum"
          done

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # Works on the release by its ID. Changes assets only while the release is a draft, replaces only those whose
      # digest differs, checks the four digests, and publishes last. A release that is already public is complete
      # when its four digests match, and is never changed.
      - name: Attach the files, check the release, and publish it
        working-directory: assets
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE: ${{ needs.pending.outputs.release }}
          TAG: ${{ needs.pending.outputs.tag }}
          SHA: ${{ needs.pending.outputs.sha }}
        run: |
          set -euo pipefail
          repo=repos/$GITHUB_REPOSITORY
          fail() { echo "::error::$*" >&2; exit 1; }
          release() { gh api "$repo/releases/$RELEASE"; }
          attached() { release | jq -r '.assets[] | "\(.name) \(.digest)"' | LC_ALL=C sort; }
          local=$(for file in *; do echo "$file sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"; done | LC_ALL=C sort)
          state=$(release)
          [ "$(jq -r .tag_name <<< "$state")" = "$TAG" ] || fail "the release $RELEASE is not $TAG"
          if [ "$(jq -r .draft <<< "$state")" = false ]; then
            [ "$(attached)" = "$local" ] || fail "the release $TAG is already public, and its files are not the four checked ones. Nothing was changed. Attach them by hand as the README's \"When a release stops half-way\" says."
            echo "The release $TAG is already public with these four files: nothing to do."
            exit 0
          fi
          [ "$(gh api "$repo/commits/refs/tags/$TAG" --jq .sha)" = "$SHA" ] || fail "the tag $TAG no longer points at $SHA"
          jq -r '.assets[] | "\(.id) \(.name) \(.digest)"' <<< "$state" | while read -r asset name digest; do
            grep -qxF "$name $digest" <<< "$local" || gh api -X DELETE "$repo/releases/assets/$asset" > /dev/null
          done
          upload=$(jq -r '.upload_url | sub("\\{.*$"; "")' <<< "$state")
          for file in *; do
            [ "$(release | jq -r .draft)" = true ] || fail "the release $TAG was published while this job ran; nothing more was changed"
            if ! attached | grep -qxF "$(grep "^$file " <<< "$local")"; then
              gh api -X POST "$upload?name=$file" -H "Content-Type: application/octet-stream" --input "$file" > /dev/null
            fi
          done
          [ "$(attached)" = "$local" ] || fail "the draft release $TAG does not hold the four checked files: run this job again"
          [ "$(gh api "$repo/commits/refs/tags/$TAG" --jq .sha)" = "$SHA" ] || fail "the tag $TAG no longer points at $SHA"
          gh api -X PATCH "$repo/releases/$RELEASE" -F draft=false > /dev/null
          [ "$(release | jq -r .draft)" = false ] || fail "the release $TAG is still a draft"
          echo "Published $TAG with its four files."

  # The crates are published by three jobs, once the release is public with its files (or at once, for a release
  # that was already complete), so that crates.io never holds back the release. The first names what crates.io lacks;
  # the second builds and checks the crates and holds no credential; the third holds the only crates.io credential
  # and runs no project code: it packages the crates again without building them, checks that each package is the
  # one the second job built, and publishes it.

  # Reads crates.io's index, as cargo does, and names the crates that lack the release's version, in the order of
  # publication. A release whose crates are all there needs nothing more.
  crates:
    name: crates to publish
    needs: [pending, publish]
    if: >-
      !cancelled() && needs.pending.result == 'success' && needs.pending.outputs.crates-sha != '' && (
        needs.pending.outputs.release == '' ||
        needs.publish.result == 'success'
      )
    runs-on: ubuntu-latest
    # The next push to main waits for this run: an index that does not answer must not hold it.
    timeout-minutes: 5
    outputs:
      crates: ${{ steps.crates.outputs.crates }}
    steps:
      - name: Name the crates that crates.io lacks
        id: crates
        env:
          VERSION: ${{ needs.pending.outputs.version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          # Prints the SHA-256 that the index records for $VERSION of the crate, or nothing when the index lacks it.
          indexed() {
            local answer
            answer=$(curl --silent --show-error --connect-timeout 10 --max-time 60 --user-agent "quadratique-release (https://github.com/$GITHUB_REPOSITORY)" \
              --write-out '\n%{http_code}' "https://index.crates.io/qu/ad/$1") || fail "crates.io's index did not answer for $1"
            case ${answer##*$'\n'} in
              200) jq -s -r --arg version "$VERSION" \
                     'if all(.[]; type == "object" and (.vers | type) == "string" and (.cksum | type) == "string")
                      then map(select(.vers == $version)) | .[0].cksum // "" else error("not an index file") end' \
                     <<< "${answer%$'\n'*}" 2> /dev/null || fail "crates.io's index answered for $1 with something that is not one JSON object per version" ;;
              404) ;;
              *) fail "crates.io's index answered ${answer##*$'\n'} for $1" ;;
            esac
          }
          missing=""
          for crate in quadratique-server quadratique; do
            sum=$(indexed "$crate")
            [ -n "$sum" ] || missing="$missing $crate"
          done
          if [ -z "$missing" ]; then
            echo "crates.io has both crates at $VERSION: nothing to publish."
          else
            echo "crates.io lacks$missing at $VERSION."
            echo "crates=${missing# }" >> "$GITHUB_OUTPUT"
          fi

  # Builds what the crates carry and checks them, from the tag's commit. Runs project code, so it holds no token: it
  # cannot ask for an OpenID Connect token and runs in no environment. It hands the third job the SHA-256 of each
  # package and the staged web app.
  crates-build:
    name: build the crates
    needs: [pending, crates]
    if: ${{ !cancelled() && needs.crates.result == 'success' && needs.crates.outputs.crates != '' }}
    runs-on: ubuntu-latest
    outputs:
      checksums: ${{ steps.checksums.outputs.checksums }}
    # Only stops a hang.
    timeout-minutes: 60
    steps:
      # The release's commit, by its SHA: a tag name could also be a branch's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pending.outputs.crates-sha }}
          # Moon compares the checkout with `main`, so it needs the history.
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag points at this commit
        env:
          VERSION: ${{ needs.pending.outputs.version }}
        run: test "$(git rev-parse "refs/tags/v$VERSION^{commit}")" = "$(git rev-parse HEAD)"

      # The store engine is compiled from C and links zlib.
      - name: Install the system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential zlib1g-dev

      # Installs proto, then the tools that .prototools pins, and caches them.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - run: pnpm install --frozen-lockfile

      - name: Check that both crates have the release's version
        working-directory: apps/quadratique
        env:
          VERSION: ${{ needs.pending.outputs.version }}
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --no-deps --format-version 1)
          for crate in quadratique-server quadratique; do
            found=$(jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version' <<< "$metadata")
            [ "$found" = "$VERSION" ] || { echo "::error::the crate $crate is at '$found', but the release is $VERSION" >&2; exit 1; }
          done
          wanted=$(jq -r '.packages[] | select(.name == "quadratique") | .dependencies[] | select(.name == "quadratique-server") | .req' <<< "$metadata")
          [ "$wanted" = "^$VERSION" ] || { echo "::error::the crate quadratique requires quadratique-server '$wanted', not ^$VERSION" >&2; exit 1; }

      # Builds the web app, copies it into the server crate, and checks that both crates carry what they read. The
      # server's tasks stage-web and preflight do the same on a person's machine, but moon does not run them in CI
      # (runInCI: false) and answers "No tasks found", so the job runs their two steps itself.
      - name: Build the web app, stage it in the server crate, and check what both crates carry
        run: |
          set -euo pipefail
          moon run quadratique-web:build
          cd apps/quadratique/server
          rm -rf web-dist
          cp -R ../web/dist web-dist
          sh preflight.sh

      # Packs both crates and builds each one from its package, as cargo publish would.
      - name: Package and build both crates as crates.io will serve them
        working-directory: apps/quadratique
        run: cargo package --workspace --allow-dirty --locked

      - name: Record the SHA-256 of each package
        id: checksums
        working-directory: apps/quadratique
        env:
          VERSION: ${{ needs.pending.outputs.version }}
        run: |
          set -euo pipefail
          sums=""
          for crate in quadratique-server quadratique; do
            sums="$sums $crate=$(sha256sum "target/package/$crate-$VERSION.crate" | cut -d ' ' -f 1)"
          done
          echo "checksums=${sums# }" | tee -a "$GITHUB_OUTPUT"

      # The staged web app is not in git; the third job packages the server crate with this copy.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crates-web-dist
          path: apps/quadratique/server/web-dist
          if-no-files-found: error
          include-hidden-files: true
          # A re-run of this job keeps the run, and so the artifact's name.
          overwrite: true

  # The only job that may ask for an OpenID Connect token, in the environment `crates-io`, which only `main` may
  # deploy to: crates.io gives a token for this workflow file in that environment only, so a pull request that edits
  # this file gets none. It runs the checkout, rustup and cargo, and no project code: no install script, no moon task,
  # no build (cargo package --no-verify and cargo publish --no-verify compile nothing). It reads crates.io's index
  # again, so that a run of the failed jobs skips what an earlier attempt published; packages each missing crate;
  # stops unless each package has the SHA-256 that the second job recorded; and only then gets a crates.io token,
  # which lasts 30 minutes and is revoked when the job ends. cargo uploads quadratique-server first and waits up to
  # 60 seconds for the index to list it before it uploads quadratique. Last, the index must record the recorded
  # SHA-256 for each crate.
  crates-publish:
    name: publish the crates to crates.io
    needs: [pending, crates-build]
    if: ${{ !cancelled() && needs.crates-build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    # Only stops a hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pending.outputs.crates-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag points at this commit
        env:
          VERSION: ${{ needs.pending.outputs.version }}
        run: test "$(git rev-parse "refs/tags/v$VERSION^{commit}")" = "$(git rev-parse HEAD)"

      # rustup comes with the runner image and installs the toolchain from static.rust-lang.org; nothing is restored
      # from a cache that a job running project code could have written.
      - name: Install the Rust that rust-toolchain.toml pins
        working-directory: apps/quadratique
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt
          cargo -V | grep -q "^cargo $channel " || { cargo -V; echo "::error::cargo is not $channel" >&2; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crates-web-dist
          path: apps/quadratique/server/web-dist

      - name: Package the crates that crates.io lacks and check them against the built ones
        id: packages
        working-directory: apps/quadratique
        env:
          VERSION: ${{ needs.pending.outputs.version }}
          CHECKSUMS: ${{ needs.crates-build.outputs.checksums }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          indexed() {
            local answer
            answer=$(curl --silent --show-error --connect-timeout 10 --max-time 60 --user-agent "quadratique-release (https://github.com/$GITHUB_REPOSITORY)" \
              --write-out '\n%{http_code}' "https://index.crates.io/qu/ad/$1") || fail "crates.io's index did not answer for $1"
            case ${answer##*$'\n'} in
              200) jq -s -r --arg version "$VERSION" \
                     'if all(.[]; type == "object" and (.vers | type) == "string" and (.cksum | type) == "string")
                      then map(select(.vers == $version)) | .[0].cksum // "" else error("not an index file") end' \
                     <<< "${answer%$'\n'*}" 2> /dev/null || fail "crates.io's index answered for $1 with something that is not one JSON object per version" ;;
              404) ;;
              *) fail "crates.io's index answered ${answer##*$'\n'} for $1" ;;
            esac
          }
          built() { tr ' ' '\n' <<< "$CHECKSUMS" | sed -n "s/^$1=//p"; }
          missing=()
          for crate in quadratique-server quadratique; do
            [ -n "$(built "$crate")" ] || fail "the job 'build the crates' recorded no SHA-256 for $crate"
            sum=$(indexed "$crate")
            if [ -z "$sum" ]; then
              missing+=("$crate")
            elif [ "$sum" = "$(built "$crate")" ]; then
              echo "$crate $VERSION is already on crates.io, as built: skipped."
            else
              fail "crates.io holds $crate $VERSION with the SHA-256 $sum, not the $(built "$crate") of the package built from the tag. Nothing was published. Find out who published it before you go on."
            fi
          done
          if [ ${#missing[@]} = 0 ]; then
            echo "crates.io has both crates at $VERSION, as built: nothing to publish."
            exit 0
          fi
          cargo package --no-verify --locked --allow-dirty "${missing[@]/#/--package=}"
          for crate in "${missing[@]}"; do
            sum=$(sha256sum "target/package/$crate-$VERSION.crate" | cut -d ' ' -f 1)
            [ "$sum" = "$(built "$crate")" ] || fail "the package of $crate has the SHA-256 $sum, not the $(built "$crate") that the job 'build the crates' built and checked. Nothing was published. Run the whole workflow again."
          done
          echo "crates=${missing[*]}" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.packages.outputs.crates != ''
        id: crates-io

      - name: Publish the checked packages
        if: steps.packages.outputs.crates != ''
        working-directory: apps/quadratique
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
          VERSION: ${{ needs.pending.outputs.version }}
          CHECKSUMS: ${{ needs.crates-build.outputs.checksums }}
          CRATES: ${{ steps.packages.outputs.crates }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          indexed() {
            local answer
            answer=$(curl --silent --show-error --connect-timeout 10 --max-time 60 --user-agent "quadratique-release (https://github.com/$GITHUB_REPOSITORY)" \
              --write-out '\n%{http_code}' "https://index.crates.io/qu/ad/$1") || fail "crates.io's index did not answer for $1"
            case ${answer##*$'\n'} in
              200) jq -s -r --arg version "$VERSION" \
                     'if all(.[]; type == "object" and (.vers | type) == "string" and (.cksum | type) == "string")
                      then map(select(.vers == $version)) | .[0].cksum // "" else error("not an index file") end' \
                     <<< "${answer%$'\n'*}" 2> /dev/null || fail "crates.io's index answered for $1 with something that is not one JSON object per version" ;;
              404) ;;
              *) fail "crates.io's index answered ${answer##*$'\n'} for $1" ;;
            esac
          }
          built() { tr ' ' '\n' <<< "$CHECKSUMS" | sed -n "s/^$1=//p"; }
          read -ra crates <<< "$CRATES"
          cargo publish --locked --no-verify --allow-dirty "${crates[@]/#/--package=}"
          for crate in quadratique-server quadratique; do
            sum=$(indexed "$crate")
            [ -n "$sum" ] || fail "crates.io's index does not list $crate $VERSION yet. Check https://crates.io/crates/$crate/$VERSION, then run the failed jobs again."
            [ "$sum" = "$(built "$crate")" ] || fail "crates.io holds $crate $VERSION with the SHA-256 $sum, not the $(built "$crate") of the package built from the tag."
          done
          echo "crates.io has both crates at $VERSION, with the SHA-256 of the packages built from the tag."
